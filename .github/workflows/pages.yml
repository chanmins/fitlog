# Disabled on purpose — FITLOG deploys only to Firebase Hosting
# (https://fitlog-4fe54.web.app).
#
# Running GitHub Pages alongside Firebase Hosting served the same app from two
# different origins. Firebase only auto-authorizes its own web.app /
# firebaseapp.com domains for Google Sign-In, so login worked on one origin and
# failed with auth/unauthorized-domain on the other — with no clue as to why,
# since both URLs look like "the app". Keeping a single canonical domain avoids
# that whole class of bug.
#
# The `push:` trigger is removed rather than the file: unpublishing the Pages
# site in repo Settings does NOT stop this workflow, and any later push would
# silently republish the ghost copy. `workflow_dispatch` keeps it manually
# runnable from the Actions tab if a static mirror is ever wanted again.
#
# To retire GitHub Pages completely:
#   1. Settings → Pages → "Unpublish site"
#   2. Keep this file as-is (or delete it outright).
name: Deploy GitHub Pages (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site files
        run: |
          mkdir _site
          cp index.html styles.css app.js db.js exercises.js sw.js manifest.json .nojekyll firebase-config.js cloud.js _site/
          cp -r icons _site/icons
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
