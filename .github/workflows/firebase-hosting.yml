name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fitlog-4fe54
          channelId: live

# Firestore rules are NOT deployed from CI.
#
# A "Deploy Firestore rules" step used to live here, but the service account
# behind FIREBASE_SERVICE_ACCOUNT is the one Firebase auto-creates for the
# GitHub integration: it carries Hosting permissions only, so the step failed on
# every push while hosting itself deployed fine. A permanently-red deploy is
# worse than no step at all — it trains you to ignore the X, and a real hosting
# failure then looks identical to the usual noise.
#
# firestore.rules in this repo stays the source of truth for review purposes;
# publish it from Firebase Console → Firestore Database → 규칙 → 게시.
#
# To move rules back into CI later, grant the service account the
# "Firebase Rules Admin" role (roles/firebaserules.admin) in Google Cloud
# Console → IAM, then re-add:
